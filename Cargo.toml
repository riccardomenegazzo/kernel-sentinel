[package]
name = "kernel-sentinel"
version = "0.1.0"
edition = "2021"
license = "Apache-2.0"
description = "Experimental Linux runtime security agent using Rust, eBPF CO-RE, and BPF LSM."
repository = "https://github.com/riccardomenegazzo/kernel-sentinel"
keywords = ["ebpf", "linux", "security", "runtime-security", "rust"]
categories = ["command-line-utilities", "os::linux-apis"]

[dependencies]
anyhow = "1.0"
chrono = { version = "0.4", features = ["serde"] }
clap = { version = "4.5", features = ["derive"] }
libbpf-rs = "0.26.2"
plain = "0.2"
procfs = "0.17"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
serde_yaml = "0.9"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }

[build-dependencies]
libbpf-cargo = "0.26.2"

[profile.release]
lto = "thin"
codegen-units = 1
strip = "symbols"
