name: CI

on:
  pull_request:
  push:
    branches: ["main"]

jobs:
  rust:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - name: Install native dependencies
        run: sudo apt-get update && sudo apt-get install -y libelf-dev zlib1g-dev pkg-config
      - run: cargo fmt --all -- --check
      - run: cargo test --lib
      - run: cargo clippy --lib -- -D warnings

  bpf:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - name: Install BPF toolchain
        run: sudo apt-get update && sudo apt-get install -y clang llvm bpftool libelf-dev zlib1g-dev pkg-config
      - name: Generate CO-RE header
        run: make bootstrap
      - name: Compile BPF-enabled agent
        run: cargo check --features bpf
